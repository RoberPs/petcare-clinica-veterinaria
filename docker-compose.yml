# Entorno local: PostgreSQL de desarrollo, PostgreSQL de pruebas y el proveedor de correo falso.
# Uso: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare
      POSTGRES_DB: petcare
    ports:
      - '5434:5432'
    volumes:
      - petcare-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U petcare']
      interval: 5s
      retries: 10

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare
      POSTGRES_DB: petcare_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U petcare']
      interval: 5s
      retries: 10

  # Imita la API transaccional de Brevo y guarda los correos en memoria (GET /emails).
  email-fake:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./scripts/fake-email-provider.ts:/app/fake-email-provider.ts:ro
    command: ['node', '--experimental-strip-types', 'fake-email-provider.ts', '--port', '8025']
    ports:
      - '8025:8025'

volumes:
  petcare-db:
