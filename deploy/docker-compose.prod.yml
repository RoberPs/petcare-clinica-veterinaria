# Producción en el VPS compartido. Uso (desde la raíz del repositorio):
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# La app solo es accesible a través del Caddy compartido (red chatbot_proxy): no publica puertos.
name: petcare

# Límites para convivir con el chatbot en el VPS compartido: un pico de PetCare (sharp procesando una
# foto, una consulta pesada) no debe dejar sin memoria al resto. Se pueden ajustar desde deploy/.env.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  petcare-app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: petcare-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Fotos de producto subidas desde el panel (feature 008, G4).
      UPLOADS_DIR: /app/var/uploads
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@petcare-db:5432/${POSTGRES_DB}
    volumes:
      - petcare-uploads:/app/var/uploads
    depends_on:
      petcare-db:
        condition: service_healthy
    networks:
      - chatbot_proxy
      - petcare_internal
    mem_limit: ${PETCARE_APP_MEM:-768m}
    cpus: ${PETCARE_APP_CPUS:-1.0}
    pids_limit: 256
    # La app corre como el usuario petcare y no necesita capacidades del kernel.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: *logging

  petcare-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - petcare-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      retries: 10
    networks:
      - petcare_internal
    mem_limit: ${PETCARE_DB_MEM:-512m}
    cpus: ${PETCARE_DB_CPUS:-1.0}
    pids_limit: 256
    logging: *logging

networks:
  chatbot_proxy:
    external: true
  petcare_internal:
    internal: true

volumes:
  petcare-db-data:
  # Fotos de producto subidas desde el panel: entra en la copia de seguridad (deploy/README.md).
  petcare-uploads:
