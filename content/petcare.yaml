legal_pages:
  - kind: aviso-legal
    title: Aviso legal
    version: '2026-11-12'
    updated_on: '2026-11-12'
    body_md: |
      ## Una web de demostración

      Esta web es una **demostración**. **PetCare es una clínica veterinaria ficticia**: no presta
      servicios veterinarios y no tiene local abierto al público. La tienda funciona de punta a punta,
      pero **los pagos son de prueba**: no se cobra nada y no se envía ningún producto. Los nombres del
      equipo, las cifras y la dirección son inventados.

      ## Titular de la web

      El titular y responsable de esta web de demostración es **${LEGAL_OWNER_NAME}**. Puedes
      escribir a **${LEGAL_CONTACT_EMAIL}** para cualquier cuestión sobre la web.

      Al tratarse de una demostración, no se indica razón social ni NIF de ninguna empresa.

      ## Uso de la web

      Los contenidos se ofrecen solo con fines de demostración. No sustituyen el consejo de un
      profesional veterinario: si tu animal está enfermo, acude a una clínica real.

      ## Enlaces

      Esta web puede enlazar a servicios de terceros, como el mapa de OpenStreetMap. Su contenido es
      responsabilidad de sus titulares.
  - kind: privacidad
    title: Política de privacidad
    version: '2026-11-16'
    updated_on: '2026-11-16'
    body_md: |
      ## Quién trata tus datos

      El responsable del tratamiento es **${LEGAL_OWNER_NAME}**, responsable de esta web de
      demostración. **PetCare es una clínica ficticia**, así que tus datos no llegan a ninguna
      clínica: los recibe el responsable de la demo. Contacto: **${LEGAL_CONTACT_EMAIL}**.

      ## Qué datos pedimos y para qué

      En el formulario de contacto:

      - **Nombre y correo electrónico**: para responder a tu mensaje.
      - **Teléfono** (opcional): para devolverte la llamada si lo prefieres.
      - **Motivo**: para dirigir tu consulta a quien corresponda.
      - **Mensaje**: para saber qué necesitas.

      Guardamos también la fecha en que aceptas esta política y su versión. No guardamos tu
      dirección IP junto al mensaje: solo se usa, cifrada y durante 24 horas, para frenar envíos
      automáticos.

      Si creas una **cuenta de cliente**:

      - **Nombre y apellidos**: para saludarte y saber quién eres cuando pidas cita.
      - **Correo electrónico**: para iniciar sesión, confirmar que es tuyo y enviarte los avisos de
        tu cuenta (confirmación, cambio de contraseña, eliminación).
      - **Contraseña**: para proteger tu cuenta. Solo guardamos una huella cifrada (Argon2id), nunca
        la contraseña.
      - **Teléfono y dirección** (opcionales): para contactarte y, en el futuro, para los envíos de
        la tienda.
      - **Tus mascotas** (nombre, especie y fecha de nacimiento): para tener su ficha a mano y
        preparar sus citas.
      - **Preferencia de consejos y novedades** (opcional): solo te escribimos si la activas.
      - La fecha y la versión de esta política y de los términos cuando los aceptas, y los cambios de
        tu preferencia de comunicaciones.

      Para frenar los accesos indebidos contamos los intentos fallidos de inicio de sesión, siempre
      cifrados y durante 24 horas como mucho.

      Si haces un **pedido en la tienda** (con cuenta o sin ella):

      - **Nombre, apellidos y correo electrónico**: para identificar el pedido y enviarte la
        confirmación y los avisos de su estado.
      - **Dirección, código postal y ciudad**: solo si eliges el envío a domicilio, para entregarlo.
      - **Los productos, los importes y el estado del pedido**, incluido el pago y, si lo hay, el
        reembolso.

      **No vemos ni guardamos los datos de tu tarjeta**: el pago se hace en la página de la pasarela.
      El carrito se guarda en el servidor y se asocia a tu navegador con la cookie técnica `pc_cart`.

      Si te suscribes al **boletín de consejos y novedades**:

      - **Correo electrónico**: para enviarte el boletín y el enlace para confirmar la suscripción.
      - La fecha en que te suscribes y confirmas, y la versión de la
        [política del boletín](/politica-del-boletin) que aceptas.

      Si te das de baja, borramos tu correo de la lista y guardamos solo una huella cifrada, que no
      se puede revertir sin la clave, con las fechas y el motivo, para poder demostrar que respetamos
      tu decisión.

      ## Base legal

      - **Formulario de contacto**: tu consentimiento, que das al marcar la casilla de privacidad.
      - **Cuenta de cliente y mascotas**: la ejecución del contrato (los términos de uso) que aceptas
        al crear la cuenta.
      - **Consejos y novedades**: tu consentimiento, que puedes retirar cuando quieras desde
        "Datos personales".
      - **Pedidos de la tienda**: la ejecución del contrato de compra (las condiciones de venta) y,
        después, la obligación legal de conservar los datos de las ventas.
      - **Boletín**: tu consentimiento, que das al confirmar la suscripción desde el correo y que
        puedes retirar en cualquier momento con el enlace de baja de cada correo.

      ## Cuánto tiempo los guardamos

      - Los mensajes de contacto se borran automáticamente a los **12 meses**.
      - Los datos de tu cuenta y de tus mascotas se guardan **hasta que eliminas la cuenta**. Al
        eliminarla se borran en el acto y de forma definitiva.
      - Las cuentas que no se confirman se borran a los **7 días**.
      - Las sesiones caducan solas (a las 2 horas sin actividad, o a los 30 días con "Recordarme").
      - Los carritos sin cuenta se borran a los **30 días** sin cambios.
      - Los pedidos se guardan **6 años** por obligación legal, también si eliminas la cuenta (en ese
        caso dejan de estar asociados a ella). Pasado ese plazo se borran tus datos de contacto y la
        dirección, y solo quedan los importes.
      - Las suscripciones al boletín sin confirmar se borran a los **30 días**; las confirmadas se
        guardan hasta que te das de baja, y la constancia anónima de la baja, **3 años**.

      ## Quién más interviene

      Los correos se envían con **Brevo** (Sendinblue SAS), que actúa como encargado del tratamiento
      con un contrato que protege tus datos. Los pagos con tarjeta los procesa **Stripe** (Stripe
      Payments Europe, Ltd.), también como encargado del tratamiento; en esta demostración funciona en
      modo de pruebas y no se cobra nada. No cedemos datos a nadie más.

      ## Tus derechos

      Puedes pedir el acceso, la rectificación, la supresión, la limitación, la oposición y la
      portabilidad de tus datos escribiendo a **${LEGAL_CONTACT_EMAIL}**. Si crees que no se han
      respetado, puedes reclamar ante la Agencia Española de Protección de Datos (aepd.es).

      Si tienes cuenta, desde **Mi cuenta → Datos personales** puedes, sin escribirnos:

      - corregir tus datos y los de tus mascotas;
      - **descargar tus datos** en un archivo JSON, con tus pedidos (portabilidad);
      - **eliminar tu cuenta**, con todos sus datos y mascotas (supresión);
      - activar o desactivar los consejos y novedades.
  - kind: cookies
    title: Política de cookies
    version: '2026-11-12'
    updated_on: '2026-11-12'
    body_md: |
      ## Qué cookies usamos

      - **pc_consent** (propia y necesaria): recuerda si aceptas o rechazas las cookies de terceros.
        Dura 12 meses y no sirve para seguirte.
      - **pc_session** (propia y necesaria): mantiene abierta tu sesión si tienes cuenta. Se borra al
        cerrar el navegador o, si marcas "Recordarme", a los 30 días. Solo se crea al iniciar sesión.
      - **pc_login_hint** (propia y necesaria): rellena tu correo en "Iniciar sesión" justo después
        de confirmarlo. Dura 10 minutos.
      - **pc_cart** (propia y necesaria): recuerda tu carrito si compras sin cuenta. Solo se crea al
        añadir el primer producto y dura 30 días. Al iniciar sesión, el carrito pasa a tu cuenta y la
        cookie se borra.

      No usamos cookies de analítica ni de publicidad.

      ## Contenido de terceros

      El **mapa de OpenStreetMap** de las páginas La clínica y Contacto se carga desde
      openstreetmap.org y puede guardar datos en tu navegador. Por eso **solo se carga si lo
      aceptas**. Si lo rechazas, verás la dirección y un enlace para abrirla en el mapa.

      ## Cambiar tu elección

      Puedes cambiar o retirar tu consentimiento en cualquier momento desde **Configurar cookies**,
      en el pie de todas las páginas. La web es una demostración: **PetCare es una clínica
      ficticia** y el responsable es ${LEGAL_OWNER_NAME}.
  - kind: terminos
    title: Términos de uso
    version: '2026-11-12'
    updated_on: '2026-11-12'
    body_md: |
      ## Objeto

      Estos términos regulan el uso de esta web de demostración. **PetCare es una clínica
      ficticia**: no presta servicios veterinarios. La tienda funciona de punta a punta, pero los
      pagos son de prueba: **no se cobra nada y no se envía ningún producto**. Las compras se rigen
      por las [condiciones de venta](/condiciones-de-venta).

      ## Uso correcto

      Te pedimos que no uses el formulario para enviar publicidad, contenido ofensivo o datos de
      otras personas sin su permiso.

      ## Responsabilidad

      La información sobre salud animal es orientativa y no sustituye la consulta con un
      veterinario.

      ## Contacto

      Para cualquier duda sobre estos términos, escribe a ${LEGAL_CONTACT_EMAIL}.
  - kind: condiciones-venta
    title: Condiciones de venta
    version: '2026-11-12'
    updated_on: '2026-11-12'
    body_md: |
      ## Una tienda de demostración

      **PetCare es una clínica veterinaria ficticia** y esta tienda es una demostración. Todo el
      proceso de compra es real (carrito, pedido, pago, correos y seguimiento), pero **los pagos son
      de prueba**: no se cobra nada, no se envía ningún producto y no se emiten facturas. No uses una
      tarjeta real.

      El responsable de esta web es **${LEGAL_OWNER_NAME}**. Contacto: **${LEGAL_CONTACT_EMAIL}**.

      ## Precios

      Los precios se muestran en euros con el **IVA incluido**. El importe de cada pedido es el que
      ves en el resumen antes de confirmarlo y el que figura en el correo de confirmación.

      ## Pedido y pago

      - **Con tarjeta**: al confirmar el pedido pasas a la página de la pasarela de pago. Las unidades
        quedan reservadas durante el plazo de pago que se indica; si no se completa, el pedido se
        cancela y las unidades vuelven a estar disponibles.
      - **En la clínica**: solo con recogida en la clínica. El pedido queda reservado hasta la fecha
        límite de recogida que te indicamos por correo; si no lo recoges, se cancela.

      Mientras el pedido esté pendiente de pago puedes cancelarlo desde el enlace del correo o desde
      **Mi cuenta → Mis pedidos**.

      ## Envío y recogida

      Puedes elegir el envío a domicilio (solo en España) o la recogida en la clínica en su horario.
      El coste y el plazo de cada opción se muestran antes de confirmar.

      ## Cancelaciones y reembolsos

      Si la clínica cancela un pedido ya pagado, te devuelve el importe completo en el mismo medio de
      pago (en esta demostración, de forma simulada). Las devoluciones de productos ya entregados no
      están disponibles en la demostración.

      ## Códigos de descuento

      Cada código tiene sus condiciones (vigencia, pedido mínimo y número de usos). Solo se puede
      aplicar un código por pedido y no se aplica a los gastos de envío.

      ## Datos personales

      Usamos tus datos solo para gestionar el pedido. Tienes toda la información en la
      [política de privacidad](/privacidad).

  - kind: boletin
    title: Política del boletín
    version: '1.0'
    updated_on: '2026-11-16'
    body_md: |
      ## Qué es el boletín

      Un correo con consejos para cuidar a tus animales y novedades de la clínica, **como mucho una vez
      al mes**. **PetCare es una clínica ficticia**: el boletín forma parte de una web de
      demostración.

      ## Quién lo envía

      El responsable es **${LEGAL_OWNER_NAME}**, responsable de esta web de demostración. Contacto:
      **${LEGAL_CONTACT_EMAIL}**.

      ## Qué datos usamos

      Solo tu **correo electrónico**, la fecha en que te suscribes y confirmas, y la versión de esta
      política que aceptas. No lo cruzamos con otros datos ni lo usamos para nada más.

      ## Doble confirmación

      Al suscribirte te enviamos un correo con un enlace para confirmar. Hasta que lo confirmas no
      recibes el boletín. El enlace caduca a los **7 días**; si no lo usas, puedes pedir otro, y la
      suscripción sin confirmar se borra a los **30 días**.

      ## Cómo darte de baja

      Cada correo lleva un enlace **"Darme de baja"** que funciona sin iniciar sesión. Si tienes
      cuenta, también puedes desactivar los consejos y novedades en **Mi cuenta → Datos personales**.
      Al darte de baja borramos tu correo de la lista y guardamos durante **3 años** solo una huella
      cifrada, con las fechas y el motivo, para poder demostrar que respetamos tu decisión.

      ## Quién más interviene

      Los correos se envían con **Brevo** (Sendinblue SAS), como encargado del tratamiento.

      ## Tus derechos

      Tienes los mismos derechos que se explican en la [política de privacidad](/privacidad).

