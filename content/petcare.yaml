services:
  - slug: consulta-general
    name: Consulta general
    description: >-
      Exploración completa, revisión del historial y un plan claro para lo que necesite tu animal,
      explicado sin tecnicismos.
  - slug: vacunacion-y-desparasitacion
    name: Vacunación y desparasitación
    description: >-
      Calendario de vacunas adaptado a la edad y al estilo de vida de tu mascota, con recordatorios
      para que no se te pase ninguna dosis.
  - slug: medicina-preventiva
    name: Medicina preventiva
    description: >-
      Revisiones anuales, analíticas de control y consejos de alimentación para detectar a tiempo
      cualquier cambio.
  - slug: cirugia-programada
    name: Cirugía programada
    description: >-
      Esterilizaciones y pequeñas intervenciones con anestesia monitorizada y seguimiento del
      postoperatorio en casa.
  - slug: salud-dental
    name: Salud dental
    description: >-
      Limpiezas de boca con ultrasonidos, extracciones cuando hacen falta y pautas sencillas para el
      cepillado diario.
  - slug: dermatologia
    name: Dermatología
    description: >-
      Estudio de picores, caída de pelo y alergias, con pruebas en consulta y tratamientos que se
      pueden seguir en casa.
  - slug: ecografia-y-radiologia
    name: Ecografía y radiología
    description: >-
      Pruebas de imagen en la propia clínica para llegar antes al diagnóstico, sin desplazamientos
      añadidos.
  - slug: exoticos-y-pequenos-mamiferos
    name: Conejos y pequeños mamíferos
    description: >-
      Atención específica para conejos, cobayas y hurones, con un manejo tranquilo adaptado a cada
      especie.

