faq_topics:
  - slug: citas
    name: Citas
    faqs:
      - slug: como-reservo
        question: ¿Cómo reservo una visita?
        answer_md: >-
          Por ahora, llamando por teléfono o escribiéndonos desde la página de
          [Contacto](/contacto). Muy pronto también podrás hacerlo desde
          [Pide cita](section:reservas).
      - slug: cuanto-dura-la-consulta
        question: ¿Cuánto dura una consulta normal?
        answer_md: >-
          Reservamos unos **30 minutos** por visita para explorar con calma y resolver tus dudas.
      - slug: llegar-tarde
        question: ¿Qué pasa si llego tarde?
        answer_md: >-
          Avísanos en cuanto lo sepas. Si el margen es pequeño te atendemos igualmente; si no, te
          proponemos otro hueco ese mismo día o el siguiente.
  - slug: tienda
    name: Tienda
    faqs:
      - slug: que-vendeis
        question: ¿Vendéis piensos y antiparasitarios?
        answer_md: >-
          Sí. Tenemos una selección de alimentación y productos de higiene que recomendamos en
          consulta. Pronto podrás verla en [Nuestros productos](section:tienda).
      - slug: recoger-pedido
        question: ¿Puedo encargar un producto y recogerlo después?
        answer_md: >-
          Claro. Pregúntanos por teléfono y lo dejamos preparado con tu nombre en recepción.
      - slug: devoluciones
        question: ¿Admitís devoluciones?
        answer_md: >-
          Si el envase está sin abrir, puedes devolverlo en los 14 días siguientes a la compra con el
          justificante.
  - slug: tu-mascota
    name: Tu mascota
    faqs:
      - slug: primera-visita
        question: ¿Qué llevo el primer día?
        answer_md: >-
          La cartilla sanitaria, los informes que tengas de otras clínicas y, si es un gato, un
          transportín cerrado.
      - slug: cada-cuanto-revision
        question: ¿Cada cuánto conviene una revisión?
        answer_md: >-
          Una vez al año en adultos sanos y cada seis meses a partir de los ocho años, o antes si
          notas algún cambio.
      - slug: miedo-al-veterinario
        question: Mi perro se pone muy nervioso, ¿qué hago?
        answer_md: >-
          Cuéntanoslo al pedir la visita. Podemos darte un horario más tranquilo y preparar la sala
          antes de que entréis.
      - slug: urgencias
        question: ¿Atendéis urgencias?
        answer_md: >-
          Dentro del horario, sí: llámanos antes de venir. Fuera de horario, acude a un servicio de
          urgencias veterinarias de 24 horas.

