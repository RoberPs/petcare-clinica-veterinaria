clinic:
  name: PetCare
  demo_banner_enabled: true
  logo: media/petcare/logo.svg
  hero:
    title: Veterinaria de barrio con tiempo para escucharte
    text: >-
      Consultas sin prisas, medicina preventiva y un equipo que explica cada paso. Cuidamos de perros,
      gatos y pequeños mamíferos en un espacio pensado para que estén tranquilos.
    image: media/petcare/hero.svg
    image_alt: Ilustración de un perro y un gato sentados juntos sobre un cojín
  about:
    title: Conoce PetCare
    text: >-
      Una consulta luminosa, salas de espera separadas para perros y gatos, y profesionales que
      prefieren una explicación clara a una palabra técnica.
    image: media/petcare/clinica.svg
    image_alt: Ilustración de la sala de consulta con una camilla y una ventana grande
  # Dirección inventada a propósito (no corresponde a ningún local real).
  address:
    line: Calle de la Demostración, 1
    postal_code: '28000'
    city: Madrid
    province: Madrid
  # Coordenadas de un espacio público genérico (un parque), nunca de una vivienda ni de un negocio.
  geo:
    lat: 40.415300
    lng: -3.684500
  # Teléfono que controla el responsable de la demo. Nunca se inventa un número.
  phone:
    e164: '${CLINIC_PHONE_E164}'
    display: '${CLINIC_PHONE_DISPLAY}'
  public_email: null
  inbox_email: '${CLINIC_INBOX_EMAIL}'
  response_time_text: en un plazo de 24 horas laborables
  legal:
    owner_name: '${LEGAL_OWNER_NAME}'
    contact_email: '${LEGAL_CONTACT_EMAIL}'
    tax_id: null
    address: null

