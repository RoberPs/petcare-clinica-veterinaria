# Demo en GitHub Codespaces: contenedor de trabajo, PostgreSQL 16 y el proveedor de correo falso.
services:
  workspace:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ..:/workspaces/petcare:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare
      POSTGRES_DB: petcare
    volumes:
      - petcare-demo-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U petcare']
      interval: 5s
      retries: 10

  # Imita la API de Brevo y guarda los correos en memoria (GET /emails en el puerto 8025).
  email-fake:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../scripts/fake-email-provider.ts:/app/fake-email-provider.ts:ro
    command: ['node', '--experimental-strip-types', 'fake-email-provider.ts', '--port', '8025']

volumes:
  petcare-demo-db:
