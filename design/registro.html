<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="styles.css"></head>
<body>
<div id="site-header"></div>
<main class="auth">
  <section class="auth__card" style="width:min(560px,92vw)">
    <h1 style="font-size:32px">Crear cuenta</h1>
    <p style="margin:0">Pide citas, compra en la tienda y guarda los datos de tus mascotas.</p>
    <form class="form" action="#" method="post">
      <div class="field-row">
        <label class="field">Nombre<input type="text" name="nombre" autocomplete="given-name" required></label>
        <label class="field">Apellidos<input type="text" name="apellidos" autocomplete="family-name" required></label>
      </div>
      <label class="field">Correo electrónico<input type="email" name="email" autocomplete="email" required></label>
      <label class="field">Teléfono<input type="tel" name="telefono" autocomplete="tel"></label>
      <div class="field-row">
        <label class="field">Contraseña<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
        <label class="field">Repetir contraseña<input type="password" name="password2" autocomplete="new-password" minlength="8" required></label>
      </div>
      <label class="check"><input type="checkbox" required> Acepto la <a href="#" style="text-decoration:underline">política de privacidad</a> y los términos de uso.</label>
      <label class="check"><input type="checkbox"> Quiero recibir consejos de salud y novedades por correo.</label>
      <button class="btn btn--block" type="submit">Crear cuenta</button>
    </form>
    <p class="auth__alt">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
  </section>
</main>
<div id="site-footer"></div><script src="layout.js"></script>
</body></html>
